# Example configuration for address cleaner conditional tracing

# In environment variables:
export ADDRESSCLEANER_THRESHOLD_NS=500000  # 0.5ms threshold

# Or in your HPCC configuration YAML:
global:
  tracing:
    enabled: true
    # Other tracing configuration...

# Application code usage:
# The address cleaner will automatically use conditional tracing
# Only spans longer than 500000ns (0.5ms) or failed operations will be reported

# You can also programmatically adjust the threshold:
# setAddressCleanerThresholdNs(2000000);  // 2ms threshold