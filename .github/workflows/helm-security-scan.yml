name: Helm Charts Security Scan

on:
  pull_request:
    branches:
      - master
      - 'candidate-*'
    paths:
      - 'helm/**'
      - '.github/workflows/helm-security-scan.yml'

permissions:
  contents: read
  # Uncomment if you decide to upload SARIF to the Security tab
  # security-events: write

jobs:
  trivy-helm-scan:
    name: Scan Helm charts (IaC) + referenced images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Part 1: IaC/Helm scan (misconfigurations & secrets) ---
      # Trivy's GitHub Action supports config (IaC) scanning and will
      # recursively discover and scan Helm charts in the given path.
      - name: Trivy IaC scan (Helm)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'config'
          scan-ref: 'helm'
          # Keep output human-friendly in logs; fail on HIGH/CRITICAL
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          # Optionally include secret scanning on IaC (default enabled in config scans)

      # --- Part 2: Scan container images referenced by charts ---
      # Install Helm to template charts and extract images.
      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Install Trivy CLI once for image scanning in a loop
      - name: Set up Trivy (CLI)
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          cache: true
          # version: v0.69.1  # (optional) pin a specific Trivy version

      - name: Render charts and scan images
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Find all chart roots (directories containing Chart.yaml)
          mapfile -t CHART_DIRS < <(find helm -type f -name Chart.yaml -printf '%h\n' | sort -u)

          if [[ ${#CHART_DIRS[@]} -eq 0 ]]; then
            echo "No Helm charts found under ./helm"
            exit 0
          fi

          # Collect images from all charts
          IMAGES_FILE="$(mktemp)"
          for chart in "${CHART_DIRS[@]}"; do
            echo "::group::Template chart: ${chart}"
            # Pull chart dependencies if any (subcharts), ignore if none
            if [[ -f "${chart}/Chart.yaml" ]]; then
              helm dependency build "${chart}" || true
            fi

            # Render to stdout; extract image references
            # - Look for "image:" yaml keys and free-form values
            # - Filter obvious placeholders and dedupe
            helm template "${chart}" \
              | grep -hoE 'image:\s*[^[:space:]]+' \
              | awk '{print $2}' \
              | sed -E 's/^"(.+)"$/\1/' \
              | sed -E 's/^'"'"'(.+)'"'"'$/\1/' \
              | grep -Ev '^\s*$' \
              >> "${IMAGES_FILE}" || true

            echo "::endgroup::"
          done

          if [[ ! -s "${IMAGES_FILE}" ]]; then
            echo "No container images referenced by rendered manifests."
            exit 0
          fi

          # De-duplicate image list
          sort -u "${IMAGES_FILE}" -o "${IMAGES_FILE}"

          echo "Images to scan:"
          cat "${IMAGES_FILE}"

          # Scan each image with Trivy and fail if HIGH/CRITICAL are found
          # Use --ignore-unfixed to focus on actionable issues
          EXIT=0
          while read -r image; do
            echo "::group::Trivy image scan: ${image}"
            # Skip obviously invalid placeholders, if any slipped through
            if [[ "${image}" =~ \{\{.*\}\} ]] || [[ "${image}" =~ ^<.*>$ ]]; then
              echo "Skipping templated/placeholder image ref: ${image}"
              echo "::endgroup::"
              continue
            fi

            # The --severity filter applies to vuln scanner; --exit-code=1 will fail on findings
            # If your org uses GHAS and you prefer SARIF uploads, switch to --format sarif and upload later.
            if ! trivy image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "${image}"; then
              EXIT=1
            fi
            echo "::endgroup::"
          done < "${IMAGES_FILE}"

          exit "${EXIT}"

      # --- Optional: Upload SARIF to GitHub Security tab ---
      # Uncomment these two steps if you want results integrated into "Code scanning alerts".
      # - name: Trivy IaC (Helm) SARIF
      #   if: always()
      #   uses: aquasecurity/trivy-action@0.33.1
      #   with:
      #     scan-type: 'config'
      #     scan-ref: 'helm'
      #     format: 'sarif'
      #     output: 'trivy-helm-config.sarif'
      #     exit-code: '0'  # don't stop subsequent upload
      #
      # - name: Upload SARIF to Security tab
      #   if: always()
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: 'trivy-helm-config.sarif'